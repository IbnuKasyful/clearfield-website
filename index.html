<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearfield — Digital built for business</title>
    <meta
      name="description"
      content="Clearfield helps businesses grow online through website design and development, digital marketing, and ongoing website support."
    />
    <meta name="theme-color" content="#f2f0ec" />
    <!-- Resolve the theme before first paint so a dark visitor never sees a
         flash of the light page. Mirrors resolveTheme() in src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('clearfield-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1015');
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!-- Absolute: a relative path would resolve against /projects/ on a
         project detail route and 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clearfield — Digital built for business" />
    <meta
      property="og:description"
      content="Professional website development and digital marketing that support your business growth."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
